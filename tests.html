<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Checkpoint 2 tests (temporary dev page)</title>
<style>body{font-family:monospace}.pass{color:green}.fail{color:red}</style>
</head>
<body>
<h1>App tests (all checkpoints)</h1>
<h2 id="summary">Running…</h2>
<pre id="out"></pre>
<script type="module">
  import { conditionFor, temperatureBandFor, remindersFor, buildState, dayFromForecast } from './js/state.js';
  import { resolveVariants } from './js/variants.js';
  import { toggleDate, tripDatesFromHash, isListHash } from './js/selection.js';
  import { parseSearch, filterByState, lookupState, preferExactName } from './js/search.js';
  import { summaryFor } from './js/state.js';
  import { recommendationText, reminderText, dateLabel, temperatureRangeText } from './js/text.js';
  import { saveLocation, loadLocation, clearLocation, labelFor, fromMatch } from './js/location.js';

  const out = document.getElementById('out');
  let failures = 0;
  const section = (title) => out.insertAdjacentHTML('beforeend', `
<b>== ${title} ==</b>
`);
  const check = (name, actual, expected) => {
    const ok = JSON.stringify(actual) === JSON.stringify(expected);
    if (!ok) failures++;
    out.insertAdjacentHTML('beforeend',
      `<span class="${ok ? 'pass' : 'fail'}">${ok ? 'PASS' : 'FAIL'}</span> ${name}` +
      (ok ? '' : ` — got ${JSON.stringify(actual)}, expected ${JSON.stringify(expected)}`) + '\n');
  };
  // In-memory stand-in for localStorage so tests never touch real saved data.
  const fakeStorage = () => {
    const m = {};
    return {
      getItem: (k) => m[k] ?? null,
      setItem: (k, v) => { m[k] = v; },
      removeItem: (k) => { delete m[k]; },
      _m: m,
    };
  };
  const day = (o = {}) => ({ apparentMax: 75, apparentMin: 65, precipChancePct: 0, snowfallIn: 0, windMaxMph: 5, uvMax: 1, cloudMeanPct: 0, ...o });

  section('Recommendation state: condition (Checkpoint 2)');
  // Condition priority: Snowy > Rainy > Windy > Clear
  check('clear day', conditionFor(day()), 'Clear');
  check('windy at 20 mph', conditionFor(day({ windMaxMph: 20 })), 'Windy');
  check('not windy at 19.9', conditionFor(day({ windMaxMph: 19.9 })), 'Clear');
  check('rainy at 30%', conditionFor(day({ precipChancePct: 30 })), 'Rainy');
  check('not rainy at 29%', conditionFor(day({ precipChancePct: 29 })), 'Clear');
  check('rain beats wind', conditionFor(day({ precipChancePct: 50, windMaxMph: 30 })), 'Rainy');
  check('snow beats rain+wind', conditionFor(day({ snowfallIn: 0.1, precipChancePct: 90, windMaxMph: 30 })), 'Snowy');
  check('cloudy at 60% cloud cover', conditionFor(day({ cloudMeanPct: 60 })), 'Cloudy');
  check('not cloudy at 59%', conditionFor(day({ cloudMeanPct: 59 })), 'Clear');
  check('wind beats cloud', conditionFor(day({ cloudMeanPct: 95, windMaxMph: 25 })), 'Windy');
  check('rain beats cloud', conditionFor(day({ cloudMeanPct: 95, precipChancePct: 40 })), 'Rainy');
  check('snow beats cloud', conditionFor(day({ cloudMeanPct: 95, snowfallIn: 0.2 })), 'Snowy');
  check('cloud cover does not change reminders (UV still triggers sunscreen)', remindersFor(day({ cloudMeanPct: 90, uvMax: 5 })), ['sunscreen']);

  section('Recommendation state: temperature bands (Checkpoint 2)');
  // Temperature bands (midpoint of min/max apparent temperature)
  const band = (min, max) => temperatureBandFor(day({ apparentMin: min, apparentMax: max }));
  check('Hot at 85', band(85, 85), 'Hot');
  check('Warm at 84', band(84, 84), 'Warm');
  check('Warm at 70', band(70, 70), 'Warm');
  check('Mild at 69', band(69, 69), 'Mild');
  check('Mild at 55', band(55, 55), 'Mild');
  check('Cool at 54', band(54, 54), 'Cool');
  check('Cool at 40', band(40, 40), 'Cool');
  check('Cold at 39', band(39, 39), 'Cold');
  check('midpoint used (60-94 -> 77 Warm)', band(60, 94), 'Warm');

  section('Recommendation state: reminders (Checkpoint 2, sunscreen rule Checkpoint 4)');
  // Reminders are independent
  check('no reminders', remindersFor(day()), []);
  check('umbrella at 30%', remindersFor(day({ precipChancePct: 30 })), ['umbrella']);
  check('sunscreen at UV 3', remindersFor(day({ uvMax: 3 })), ['sunscreen']);
  check('no sunscreen at UV 2.9', remindersFor(day({ uvMax: 2.9 })), []);
  check('sunscreen + umbrella on a mixed day (59% rain, UV 5)', remindersFor(day({ precipChancePct: 59, uvMax: 5 })), ['umbrella', 'sunscreen']);
  check('sunscreen hidden at 60% rain', remindersFor(day({ precipChancePct: 60, uvMax: 8 })), ['umbrella']);
  check('hydration at apparent max 90', remindersFor(day({ apparentMax: 90 })), ['hydration']);
  check('all three at once', remindersFor(day({ precipChancePct: 40, uvMax: 8, apparentMax: 95 })), ['umbrella', 'sunscreen', 'hydration']);

  section('Outfit and wording variants (Checkpoint 2)');
  // Variants: range, persistence, independence
  const store = fakeStorage();
  const first = resolveVariants('2026-10-11', ['umbrella', 'hydration'], store);
  check('outfit variant in 1-3', [1, 2, 3].includes(first.outfitVariant), true);
  check('reminder variants in 1-3', Object.values(first.reminderVariants).every((v) => [1, 2, 3].includes(v)), true);
  check('only active reminders get variants', Object.keys(first.reminderVariants), ['umbrella', 'hydration']);
  check('stored under date key', Object.keys(store._m), ['variants:2026-10-11']);
  let stable = true;
  for (let i = 0; i < 50; i++) {
    const again = resolveVariants('2026-10-11', ['umbrella', 'hydration'], store);
    if (JSON.stringify(again) !== JSON.stringify(first)) stable = false;
  }
  check('revisiting a date returns the same variants (50 reads)', stable, true);
  const later = resolveVariants('2026-10-11', ['umbrella', 'hydration', 'sunscreen'], store);
  check('newly active reminder keeps earlier variants',
    [later.outfitVariant, later.reminderVariants.umbrella, later.reminderVariants.hydration],
    [first.outfitVariant, first.reminderVariants.umbrella, first.reminderVariants.hydration]);

  // Independence: across many fresh dates, outfit and wording must not be locked as fixed pairs
  const pairs = new Set();
  const seenOutfit = new Set();
  const seenWording = new Set();
  for (let i = 0; i < 300; i++) {
    const v = resolveVariants('d' + i, ['umbrella'], fakeStorage());
    pairs.add(v.outfitVariant + '-' + v.reminderVariants.umbrella);
    seenOutfit.add(v.outfitVariant);
    seenWording.add(v.reminderVariants.umbrella);
  }
  check('all 3 outfit variants occur', seenOutfit.size, 3);
  check('all 3 wordings occur', seenWording.size, 3);
  check('all 9 outfit x wording pairs occur (independent)', pairs.size, 9);

  // Resilience: broken storage must not crash
  const broken = { getItem() { throw new Error('blocked'); }, setItem() { throw new Error('blocked'); } };
  check('works when storage throws', [1, 2, 3].includes(resolveVariants('x', [], broken).outfitVariant), true);
  const corrupt = { getItem: () => '{not json', setItem() {} };
  check('works on corrupt stored JSON', [1, 2, 3].includes(resolveVariants('x', [], corrupt).outfitVariant), true);

  // Full state object, using Checkpoint 1's live-shaped daily data
  const daily = {
    time: ['2026-10-10', '2026-10-11'],
    apparent_temperature_max: [93.9, 91.1], apparent_temperature_min: [59.5, 71.7],
    precipitation_probability_max: [0, 1], snowfall_sum: [0, 0],
    wind_speed_10m_max: [7.7, 12.8], uv_index_max: [6.35, 6.2], cloud_cover_mean: [34, 86],
  };
  check('dayFromForecast finds date', dayFromForecast(daily, '2026-10-11').apparentMax, 91.1);
  check('dayFromForecast reads cloud cover', dayFromForecast(daily, '2026-10-11').cloudMeanPct, 86);
  check('dayFromForecast null out of range', dayFromForecast(daily, '2026-12-01'), null);
  const s = buildState({ location: 'Austin, TX', date: '2026-10-11', day: dayFromForecast(daily, '2026-10-11') }, fakeStorage());
  check('state: condition/band/reminders/range',
    [s.condition, s.temperatureBand, s.reminders, s.temperatureRangeF],
    ['Cloudy', 'Warm', ['sunscreen', 'hydration'], [72, 91]]);
  check('state has every spec key',
    ['location', 'date', 'condition', 'temperatureBand', 'reminders', 'outfitVariant', 'reminderVariants'].every((k) => k in s), true);

  section('Saved location (Checkpoint 3)');
  // Location persistence (R3, R4)
  const locStore = fakeStorage();
  check('no saved location at start', loadLocation(locStore), null);
  const a = fromMatch({ name: 'Austin', admin1: 'Texas', latitude: 30.27, longitude: -97.74 });
  const b = { name: 'Your location', latitude: 40.7, longitude: -74, source: 'device' };
  check('label includes state', labelFor({ name: 'Austin', admin1: 'Texas' }), 'Austin, Texas');
  check('label without state', labelFor({ name: 'Nowhere' }), 'Nowhere');
  saveLocation(a, locStore);
  check('saved location A loads back', loadLocation(locStore), a);
  saveLocation(b, locStore);
  check('saving B overwrites A (only most recent kept)', loadLocation(locStore), b);
  check('only one storage key used', Object.keys(locStore._m), ['location']);
  clearLocation(locStore);
  check('clear removes saved location', loadLocation(locStore), null);
  check('corrupt saved location -> null', loadLocation({ getItem: () => '{oops' }), null);
  check('incomplete saved location -> null', loadLocation({ getItem: () => '{"name":"x"}' }), null);
  check('throwing storage -> null', loadLocation({ getItem() { throw new Error('blocked'); } }), null);

  section('Written wording (Checkpoint 4)');
  // Wording (js/text.js)
  const st = (o) => ({ temperatureBand: 'Mild', condition: 'Clear', ...o });
  check('Clear: band line only', recommendationText(st({})), "It's mild. A tee and pants are fine.");
  check('Rainy: band + umbrella line', recommendationText(st({ temperatureBand: 'Cool', condition: 'Rainy' })),
    "It's cool. Wear long sleeves. It's rainy. Bring an umbrella.");
  check('every band x condition yields text', ['Hot', 'Warm', 'Mild', 'Cool', 'Cold'].every((b) =>
    ['Clear', 'Cloudy', 'Rainy', 'Snowy', 'Windy'].every((c) => recommendationText(st({ temperatureBand: b, condition: c })).length > 10)), true);
  check('3 wordings per reminder, all different', ['umbrella', 'sunscreen', 'hydration'].every((r) =>
    new Set([1, 2, 3].map((v) => reminderText(r, v))).size === 3), true);
  check('reminder variant 2 picks the second wording', reminderText('umbrella', 2), "Don't forget your umbrella.");
  check('dateLabel today', dateLabel('2026-10-11', '2026-10-11'), 'Today');
  check('dateLabel forecast day', dateLabel('2026-10-13', '2026-10-11'), 'Tue, Oct 13');
  check('temperature range text', temperatureRangeText([72, 91]), '72–91°F');

  section('Date picker and trip overview (Checkpoint 5)');
  // Trip selection (js/selection.js) and list summaries
  check('toggle adds a day', toggleDate([], '2026-10-12'), ['2026-10-12']);
  check('toggle keeps date order', toggleDate(['2026-10-14'], '2026-10-12'), ['2026-10-12', '2026-10-14']);
  check('toggle removes an already selected day', toggleDate(['2026-10-12', '2026-10-14'], '2026-10-12'), ['2026-10-14']);
  const valid = ['2026-10-11', '2026-10-12', '2026-10-13'];
  check('trip hash: valid dates kept, sorted', tripDatesFromHash('2026-10-13,2026-10-11', valid), ['2026-10-11', '2026-10-13']);
  check('trip hash: out-of-range dates dropped (R6)', tripDatesFromHash('2026-10-12,2026-12-25,2026-10-01', valid), ['2026-10-12']);
  check('trip hash: duplicates collapsed', tripDatesFromHash('2026-10-12,2026-10-12', valid), ['2026-10-12']);
  check('trip hash: empty', tripDatesFromHash(undefined, valid), []);
  check('3 selected days -> exactly 3 trip dates', tripDatesFromHash('2026-10-11,2026-10-12,2026-10-13', valid).length, 3);
  check('isListHash: date picker', isListHash('#dates'), true);
  check('isListHash: trip overview', isListHash('#trip/2026-10-12,2026-10-13'), true);
  check('isListHash: a day is not a list', isListHash('#main/2026-10-12'), false);
  check('isListHash: location and empty', [isListHash('#location'), isListHash('')], [false, false]);
  check('isListHash: lookalike names rejected', isListHash('#datesx'), false);
  check('summaryFor', summaryFor(day({ precipChancePct: 40, apparentMin: 45, apparentMax: 51 })),
    { condition: 'Rainy', temperatureBand: 'Cool', temperatureRangeF: [45, 51] });
  // Summaries must not roll variants for days the user has not opened
  const before = Object.keys(JSON.parse(JSON.stringify(localStorage)));
  summaryFor(day());
  check('summaryFor writes nothing to localStorage', Object.keys(JSON.parse(JSON.stringify(localStorage))), before);

  section('Location search parsing (Improvement 2)');
  const states = {
    AL: 'Alabama', AK: 'Alaska', AZ: 'Arizona', AR: 'Arkansas', CA: 'California', CO: 'Colorado', CT: 'Connecticut', DE: 'Delaware',
    FL: 'Florida', GA: 'Georgia', HI: 'Hawaii', ID: 'Idaho', IL: 'Illinois', IN: 'Indiana', IA: 'Iowa', KS: 'Kansas', KY: 'Kentucky',
    LA: 'Louisiana', ME: 'Maine', MD: 'Maryland', MA: 'Massachusetts', MI: 'Michigan', MN: 'Minnesota', MS: 'Mississippi', MO: 'Missouri',
    MT: 'Montana', NE: 'Nebraska', NV: 'Nevada', NH: 'New Hampshire', NJ: 'New Jersey', NM: 'New Mexico', NY: 'New York',
    NC: 'North Carolina', ND: 'North Dakota', OH: 'Ohio', OK: 'Oklahoma', OR: 'Oregon', PA: 'Pennsylvania', RI: 'Rhode Island',
    SC: 'South Carolina', SD: 'South Dakota', TN: 'Tennessee', TX: 'Texas', UT: 'Utah', VT: 'Vermont', VA: 'Virginia', WA: 'Washington',
    WV: 'West Virginia', WI: 'Wisconsin', WY: 'Wyoming', DC: 'District of Columbia',
  };
  const allStates = (makeQuery, makeExpected) => Object.entries(states).every(([abbr, name]) =>
    JSON.stringify(parseSearch(makeQuery(abbr, name))) === JSON.stringify(makeExpected(name)));
  check('51 states: "Test TX" (abbreviation, no comma)', allStates((a) => `Test ${a}`, (n) => ({ city: 'Test', state: n })), true);
  check('51 states: "Test, TX" (abbreviation, comma)', allStates((a) => `Test, ${a}`, (n) => ({ city: 'Test', state: n })), true);
  check('51 states: "Test Texas" (full name, no comma)', allStates((a, n) => `Test ${n}`, (n) => ({ city: 'Test', state: n })), true);
  check('51 states: "Test, Texas" (full name, comma)', allStates((a, n) => `Test, ${n}`, (n) => ({ city: 'Test', state: n })), true);
  check('51 states: lowercase "test tx"', allStates((a) => `test ${a.toLowerCase()}`, (n) => ({ city: 'test', state: n })), true);
  check('Austin TX (the tester case)', parseSearch('Austin TX'), { city: 'Austin', state: 'Texas' });
  check('Austin, TX', parseSearch('Austin, TX'), { city: 'Austin', state: 'Texas' });
  check('Austin Texas', parseSearch('Austin Texas'), { city: 'Austin', state: 'Texas' });
  check('Springfield MO', parseSearch('Springfield MO'), { city: 'Springfield', state: 'Missouri' });
  check('Austin alone has no state', parseSearch('Austin'), { city: 'Austin', state: null });
  check('multi-word city: Kansas City MO', parseSearch('Kansas City MO'), { city: 'Kansas City', state: 'Missouri' });
  check('multi-word city, word is also a state: Kansas City Kansas', parseSearch('Kansas City Kansas'), { city: 'Kansas City', state: 'Kansas' });
  check('city named like a state, with state: New York NY', parseSearch('New York NY'), { city: 'New York', state: 'New York' });
  check('New York alone stays a city', parseSearch('New York'), { city: 'New York', state: null });
  check('Washington alone stays a city', parseSearch('Washington'), { city: 'Washington', state: null });
  check('Washington DC', parseSearch('Washington DC'), { city: 'Washington', state: 'District of Columbia' });
  check('Washington, D.C.', parseSearch('Washington, D.C.'), { city: 'Washington', state: 'District of Columbia' });
  check('three-word state: Test District of Columbia', parseSearch('Test District of Columbia'), { city: 'Test', state: 'District of Columbia' });
  check('Austin, TX, USA ignores the country', parseSearch('Austin, TX, USA'), { city: 'Austin', state: 'Texas' });
  check('unknown text after a comma is ignored', parseSearch('Austin, Narnia'), { city: 'Austin', state: null });
  check('extra spaces are tidied', parseSearch('  Austin    TX  '), { city: 'Austin', state: 'Texas' });
  check('city ending in a non-state word: Virginia Beach', parseSearch('Virginia Beach'), { city: 'Virginia Beach', state: null });
  check('lookupState rejects non-states', [lookupState('XX'), lookupState('Texasland')], [null, null]);
  const sample = [{ name: 'Springfield', admin1: 'Missouri' }, { name: 'Wilbraham', admin1: 'Massachusetts' }, { name: 'Springfield', admin1: 'Illinois' }];
  check('filterByState keeps only that state', filterByState(sample, 'Missouri').map((r) => r.name + '/' + r.admin1), ['Springfield/Missouri']);
  check('filterByState with no state keeps everything', filterByState(sample, null).length, 3);
  check('filterByState with no match is empty (-> "Character not found")', filterByState(sample, 'Texas'), []);
  const fuzzy = [{ name: 'Austin', admin1: 'Texas' }, { name: 'Ardmore', admin1: 'Tennessee' }, { name: 'Austin', admin1: 'Minnesota' }, { name: 'Austin Park', admin1: 'Texas' }];
  check('preferExactName drops alias and prefix matches (Ardmore, Austin Park)', preferExactName(fuzzy, 'Austin').map((r) => r.name + '/' + r.admin1), ['Austin/Texas', 'Austin/Minnesota']);
  check('preferExactName ignores case', preferExactName(fuzzy, 'aUsTiN').length, 2);
  check('preferExactName ignores accents', preferExactName([{ name: 'Cañon City' }, { name: 'Other' }], 'Canon City').length, 1);
  check('preferExactName keeps all results when nothing matches exactly', preferExactName(fuzzy, 'Austn').length, 4);
  check('preferExactName on no results', preferExactName([], 'Austin'), []);

  out.insertAdjacentHTML('beforeend', `\n<b>${failures === 0 ? 'ALL TESTS PASSED' : failures + ' FAILED'}</b>\n`);
  const summary = document.getElementById('summary');
  summary.textContent = failures === 0 ? 'ALL TESTS PASSED' : `${failures} FAILED`;
  summary.className = failures === 0 ? 'pass' : 'fail';
  document.title = failures === 0 ? 'PASS' : 'FAIL';
</script>
</body>
</html>
