<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Checkpoint 1 API check (temporary)</title></head>
<body>
<pre id="out">running…</pre>
<script type="module">
  // Temporary: shows real Open-Meteo field names/units. Delete once state.js exists.
  import { geocode, fetchForecast } from './js/weather.js';
  const out = document.getElementById('out');
  try {
    const [place] = await geocode('Austin, TX');
    const data = await fetchForecast(place.latitude, place.longitude);
    out.textContent = JSON.stringify({
      place: [place.name, place.admin1, place.latitude, place.longitude],
      current_units: data.current_units, current: data.current,
      daily_units: data.daily_units, daily: data.daily,
    }, null, 1);
  } catch (e) {
    out.textContent = 'ERROR ' + e;
  }
</script>
</body>
</html>
