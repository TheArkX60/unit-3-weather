<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outfit sheet (temporary review page)</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 1rem; background: #fdf3e3; }
  h2 { margin: 1.5rem 0 .25rem; }
  .row { display: flex; gap: 1rem; flex-wrap: wrap; }
  figure { margin: 0; text-align: center; background: #fff; border-radius: 8px; padding: .5rem; }
  img { width: 180px; height: auto; display: block; }
  figcaption { font-size: .8rem; }
</style>
</head>
<body>
<h1>Outfit sheet: 5 bands x 3 variants</h1>
<p>Generated by <code>scripts/build_outfits.py</code>. Review the fit of each piece and the look of each band.</p>
<div id="sheet"></div>
<script>
  const bands = ['hot', 'warm', 'mild', 'cool', 'cold'];
  const sheet = document.getElementById('sheet');
  for (const band of bands) {
    const section = document.createElement('section');
    section.innerHTML = `<h2>${band[0].toUpperCase() + band.slice(1)}</h2><div class="row"></div>`;
    for (let n = 1; n <= 3; n++) {
      const fig = document.createElement('figure');
      fig.innerHTML = `<img src="assets/outfits/${band}-${n}.svg" alt="${band} outfit ${n}"><figcaption>${band}-${n}</figcaption>`;
      section.querySelector('.row').append(fig);
    }
    sheet.append(section);
  }
</script>
</body>
</html>
