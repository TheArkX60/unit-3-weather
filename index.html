<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What to Wear</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main id="app">
    <section id="screen-main" class="screen scene main" data-condition="loading" hidden>
      <h1 class="visually-hidden">What to wear</h1>
      <div id="main-loading" class="main__loading">
        <div class="spinner" role="status"><span class="visually-hidden">Loading weather</span></div>
      </div>
      <p id="main-error" class="main__error" role="alert" hidden>
        <span id="main-error-text"></span> <a href="#location">Change location</a>
      </p>
      <div id="main-content" class="main__content" hidden>
        <div class="main__summary">
          <p class="main__condition">
            <span id="main-condition-icon" class="icon" aria-hidden="true"></span>
            <span id="main-condition-text"></span>
          </p>
          <p id="main-range" class="main__range"></p>
          <p class="main__credit">Open-Meteo</p>
          <p id="main-recommendation" class="main__recommendation"></p>
          <ul id="main-reminders" class="main__reminders"></ul>
        </div>
        <div class="main__character">
          <img id="main-character" src="" alt="">
        </div>
        <nav class="main__bar" aria-label="Change what you're viewing">
          <a id="main-date" href="#dates"></a>
          <a id="main-location" href="#location"></a>
          <a id="main-info" href="#info">About</a>
        </nav>
      </div>
      <div id="main-effect" class="effect" aria-hidden="true"></div>
    </section>
    <section id="screen-dates" class="screen" hidden><h1>Date picker</h1><p>Placeholder</p></section>
    <section id="screen-trip" class="screen" hidden><h1>Trip overview</h1><p>Placeholder</p></section>
    <section id="screen-info" class="screen" hidden><h1>Info</h1><p>Placeholder</p></section>
    <section id="screen-location" class="screen" hidden>
      <h1>Location</h1>
      <form id="location-form">
        <label for="location-input">US city or place</label>
        <input id="location-input" type="text" autocomplete="off" placeholder="Austin, TX">
        <button type="submit">Search</button>
      </form>
      <button type="button" id="use-device">Use my device location</button>
      <p id="location-status" role="status"></p>
      <ul id="location-results"></ul>
    </section>
    <section id="screen-error" class="screen" hidden><h1>Error</h1><p>Placeholder</p></section>
  </main>
  <nav class="dev-nav" aria-label="Placeholder navigation (temporary)">
    <a href="#main">Main</a> <a href="#dates">Dates</a> <a href="#trip">Trip</a>
    <a href="#info">Info</a> <a href="#location">Location</a> <a href="#error">Error</a>
  </nav>
  <script type="module" src="js/main.js"></script>
</body>
</html>
